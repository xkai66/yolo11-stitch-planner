# S4: a=ELA_HSFPN(P4 only), b=AFPN-P345, c=Detect_AFPN_P345
# ELA is placed after the P4 backbone feature; the AFPN head still receives P3/P4/P5.
nc: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, ELA_HSFPN, []] # a: P4-only spatial/channel gating
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
head:
  - [[4, 7, 11], 1, Detect_AFPN_P345, [nc, 128]] # b=AFPN-P345, c=AFPN detection head
